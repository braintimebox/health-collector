# Reliability core of the Health Collector, tested without a device.
#
# The app target (com.braintimebox.healthcollector) needs a Mac with a signing
# identity: no HealthKit fact can be measured without a signed build on a phone.
# This workflow covers the other half — the part that is genuinely provable
# off-device: the durable outbox, retry classification, per-record acks,
# tombstones, cursors, and the file a background upload reads.
#
# Paths are rooted at the repository root: the package manifest lives beside
# Sources/ and Tests/, not under a Packages/ directory. A filter naming a
# directory this repository does not have makes the workflow run zero times,
# which reads as "CI is not configured" rather than "the filter is wrong".

name: Health Collector Core

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-collector-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routes:
    # The client and the receiver each used to keep a private route list; the probe
    # called /v1/health while the server answered /health, and nothing failed. This
    # job compares the client table against contract/routes.json on every push.
    # The live half needs a running receiver, so it runs where one exists — CI here
    # checks the half that can be checked without a server, and says so.
    name: route contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Contract matches the client
        run: python3 scripts/check-route-drift.py

      - name: The gate notices drift (self-test)
        run: python3 scripts/test-route-drift.py

  test:
    name: swift test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: ignore
