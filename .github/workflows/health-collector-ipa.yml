# Unsigned IPA for the collector skeleton, plus the text contract that guards it.
#
# The owner signs the artifact outside CI with the FlareStore certificate, so this
# workflow deliberately produces an unsigned bundle and never touches signing
# material: no certificate, no profile, no secrets.
#
# Two jobs on purpose. The contract job runs on Linux in seconds and catches the
# failures that a macOS run would only surface as a red build with no explanation:
# an entitlement dropped from the file, a Swift file that never reaches the
# compiler, a build setting pointing at nothing. The IPA job runs only if the
# contract holds.

name: Health Collector IPA

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-collector-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: bundle contract (text)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Entitlements, Info.plist and project references
        run: python3 scripts/check-bundle-contract.py

      - name: Prove the checker still fails when the contract breaks
        run: bash scripts/test-bundle-contract.sh

      # The screenshot guard is code too. Its controls used to live in chat, built by
      # hand from real captures; these fixtures are generated, so the guard is re-proved
      # on every push without a simulator.
      - name: Prove the screenshot guard still fails on a wrong capture
        run: python3 scripts/test-check-screenshots.py

      # D38: the guard is accepted not when its self-test is green, but when a weakened
      # guard turns it red. Each mutation below loosens one setting and must be caught.
      - name: Prove a weakened guard fails the self-test
        run: python3 scripts/test-screenshot-guard-mutations.py

  ipa:
    name: unsigned ipa
    needs: contract
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      # No signing identity is requested: the bundle is signed later, by the owner,
      # with a profile whose entitlements must match HealthCollector.entitlements.
      - name: Build for device (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthCollector.xcodeproj \
            -target HealthCollector \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          2>&1 | tee xcodebuild.log

      - name: Verify the app really carries core and HealthKit
        run: |
          set -euo pipefail
          app="build/HealthCollector.app"
          bin="${app}/HealthCollector"
          echo "== linked frameworks =="
          otool -L "$bin" | tee /tmp/otool.txt
          # 1. HealthKit must be linked: without it every HK call would be a stub
          #    and the app would look healthy while reading nothing.
          grep -q "HealthKit.framework" /tmp/otool.txt || {
            echo "HealthKit.framework is not linked into the app binary" >&2; exit 1; }

          # 2. The app target must actually contain the collector core, not just
          #    declare it in Package.swift. A static link inlines symbols, so the
          #    check looks for the compiled types of the core in the binary.
          echo "== core symbols =="
          nm -gU "$bin" 2>/dev/null | grep -E "HealthCollectorCore" | head -20 || true
          # `grep -q` closes the pipe early, and under `pipefail` that makes
          # `strings` fail with "failed to flush output" — a broken check, not a
          # broken build. Dump once, then grep the file.
          strings "$bin" > /tmp/app-strings.txt
          grep -q "OutboxStore" /tmp/app-strings.txt || {
            echo "HealthCollectorCore does not appear to be linked into the app" >&2; exit 1; }
          grep -q "HealthKitSource" /tmp/app-strings.txt || {
            echo "HealthKitSource is missing from the app binary" >&2; exit 1; }

          # 3. The source tree must import the module: an empty target that merely
          #    links would pass the binary checks above.
          grep -rq "import HealthCollectorCore" HealthCollector/ || {
            echo "no source file imports HealthCollectorCore" >&2; exit 1; }
          grep -rq "import HealthKit" HealthCollector/ || {
            echo "no source file imports HealthKit" >&2; exit 1; }
          echo "OK: core linked, HealthKit linked, sources import both"

      - name: Assert the bundle is complete
        run: |
          set -euo pipefail
          app="build/HealthCollector.app"
          test -d "${app}" || { echo "no app bundle at ${app}" >&2; ls -la build >&2; exit 1; }
          test -f "${app}/HealthCollector" || { echo "no executable" >&2; exit 1; }
          test -f "${app}/Info.plist" || { echo "no Info.plist" >&2; exit 1; }
          # An unsigned bundle must NOT carry a signature: if this ever starts
          # passing, the workflow has begun signing without anyone deciding to.
          if [[ -e "${app}/_CodeSignature" ]]; then
            echo "unexpected _CodeSignature in an unsigned build" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "${app}/Info.plist"

      - name: Package IPA
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/HealthCollector.app/Info.plist)"
          mkdir -p Payload
          cp -R build/HealthCollector.app Payload/
          zip -q -r "HealthCollector-${version}.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa
          shasum -a 256 *.ipa | tee HealthCollector.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: health-collector-ipa
          path: |
            HealthCollector-*.ipa
            HealthCollector.ipa.sha256
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

  ui-screenshots:
    name: ui screenshots
    needs: contract
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Simulator builds are ad-hoc signed by Xcode itself, so no identity and no
      # secrets are involved. Signing is disabled nowhere here on purpose: an
      # unsigned bundle does not install, even in a simulator.
      - name: Build for the simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthCollector.xcodeproj \
            -target HealthCollector \
            -configuration Debug \
            -sdk iphonesimulator \
            CONFIGURATION_BUILD_DIR="$PWD/build-sim" \
          2>&1 | tee sim-build.log | tail -30
          test -d build-sim/HealthCollector.app || { echo "no simulator bundle" >&2; exit 1; }

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [d["udid"] for runtime, ds in data["devices"].items() if "iOS" in runtime
                    for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")]
          print(phones[0] if phones else "")
          ')
          test -n "${udid}" || { echo "no iPhone simulator" >&2; exit 1; }
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "${udid}" || true
          xcrun simctl bootstatus "${udid}" -b

      # The three tabs are also three URLs, so the capture is a list of addresses
      # rather than a sequence of taps that a layout change would break.
      # Each tab is a separate launch, not a tap and not a URL. The URL route was
      # tried first: it delivered nothing, the job stayed green, and all three
      # pictures showed the same screen. A launch argument is read before the first
      # render, so it cannot be silently ignored.
      - name: Install and capture each screen
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl install "${UDID}" build-sim/HealthCollector.app
          mkdir -p screens
          capture () {
            appearance="$1"; tab="$2"; route="$3"; name="$4"
            xcrun simctl ui "${UDID}" appearance "${appearance}"
            xcrun simctl terminate "${UDID}" com.braintimebox.healthcollector 2>/dev/null || true
            if [ -n "${route}" ]; then
              xcrun simctl launch "${UDID}" com.braintimebox.healthcollector \
                -uiScreenshots -initialTab "${tab}" -initialRoute "${route}"
            else
              xcrun simctl launch "${UDID}" com.braintimebox.healthcollector \
                -uiScreenshots -initialTab "${tab}"
            fi
            sleep 4
            xcrun simctl io "${UDID}" screenshot "screens/${name}.png"
          }
          capture light export   ""        export
          capture light browse   ""        browse
          capture light settings ""        settings
          capture dark  export   ""        dark-export
          capture dark  browse   ""        dark-browse
          capture dark  settings ""        dark-settings
          capture light export   Server    server
          capture light settings Advanced  advanced
          ls -l screens

      # What has to be proven is that each capture shows *its* screen, not merely that
      # the files differ: three captures a minute apart differ by their clock while
      # showing one tab. The checker reads the tab bar and asks which third carries the
      # accent colour, and it fails on two files that landed on the same tab.
      - name: Assert every capture shows its own screen
        run: python3 scripts/check-screenshots.py screens

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: screens/*.png
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-logs
          path: |
            sim-build.log
            xcodebuild.log
          if-no-files-found: ignore
