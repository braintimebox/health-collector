# Reliability core of the Health Collector, tested without a device.
#
# The app target (D9: com.braintimebox.healthcollector) needs a Mac with a signing
# identity — CI produces an unsigned IPA that cannot be installed on a phone, so
# nothing here touches the app target or the simulator. This workflow runs the
# one half of the pipeline that is genuinely provable off-device: durable outbox,
# retry classification, per-record acks, tombstones, cursors.
#
# Fork-owned file: it exists in no upstream tree, so the sync-surface gate does
# not ask it for a HERMEX-FORK marker.

name: Health Collector Core

on:
  pull_request:
    paths:
      - "Packages/HealthCollectorCore/**"
      - ".github/workflows/health-collector-core.yml"
  push:
    branches:
      - "feat/health-collector**"
    paths:
      - "Packages/HealthCollectorCore/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-collector-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: |
          set -euo pipefail
          swift test --package-path Packages/HealthCollectorCore 2>&1 | tee swift-test.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: ignore
